<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Avisos - Loja</title>
    <style>
        :root {
            --laranja: #ff6600;
            --laranja-escuro: #e65c00;
            --branco: #ffffff;
            --cinza-claro: #f8f9fa;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--cinza-claro);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: var(--branco);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-top: 8px solid var(--laranja);
        }

        h2 { color: var(--laranja); text-align: center; margin-bottom: 25px; }

        .form-group {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto;
            gap: 12px;
            margin-bottom: 30px;
        }

        input {
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 8px;
            outline: none;
            transition: 0.3s;
        }

        input:focus { border-color: var(--laranja); }

        button.btn-save {
            background: var(--laranja);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        button.btn-save:hover { background: var(--laranja-escuro); transform: translateY(-2px); }

        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 15px; background: var(--cinza-claro); color: #555; }
        td { padding: 15px; border-bottom: 1px solid #eee; }

        .btn-whatsapp {
            background: #25d366;
            color: white;
            padding: 10px 18px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
            display: inline-block;
            border: none;
            cursor: pointer;
        }

        .btn-whatsapp:hover { background: #1da851; }

        .btn-delete {
            background: none;
            border: none;
            color: #ccc;
            cursor: pointer;
            font-size: 18px;
            margin-left: 10px;
            transition: 0.3s;
        }
        
        .btn-delete:hover { color: #ff4d4d; }

        /* Pop-up (Modal) */
        #modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            animation: subir 0.3s ease-out;
        }

        @keyframes subir {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-content h3 { color: var(--laranja); margin-top: 0; }
        .modal-content button {
            background: var(--laranja);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
        }

        @media (max-width: 650px) {
            .form-group { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🧡 Encomendas Pendentes</h2>
    
    <div class="form-group">
        <input type="text" id="nome" placeholder="Nome do Cliente">
        <input type="text" id="telefone" placeholder="DDD + Número">
        <input type="text" id="pedido" placeholder="Produto esperado">
        <button class="btn-save" onclick="adicionarCliente()">Salvar</button>
    </div>

    <table id="tabelaClientes">
        <thead>
            <tr>
                <th>Cliente</th>
                <th>Produto</th>
                <th>Ação</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<div id="modal">
    <div class="modal-content">
        <h3 id="modalTitulo">Aviso</h3>
        <p id="modalMensagem"></p>
        <button onclick="fecharModal()">OK</button>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', mostrarClientes);

    function mostrarModal(titulo, mensagem) {
        document.getElementById('modalTitulo').innerText = titulo;
        document.getElementById('modalMensagem').innerText = mensagem;
        document.getElementById('modal').style.display = 'flex';
    }

    function fecharModal() {
        document.getElementById('modal').style.display = 'none';
    }

    function adicionarCliente() {
        const nome = document.getElementById('nome').value;
        const telefone = document.getElementById('telefone').value.replace(/\D/g,'');
        const pedido = document.getElementById('pedido').value;

        if (!nome || !telefone || !pedido) {
            mostrarModal("Ops!", "Preencha todos os campos corretamente.");
            return;
        }

        const cliente = { nome, telefone, pedido, id: Date.now() };
        let clientes = JSON.parse(localStorage.getItem('loja_v3') || '[]');
        clientes.push(cliente);
        localStorage.setItem('loja_v3', JSON.stringify(clientes));

        document.getElementById('nome').value = '';
        document.getElementById('telefone').value = '';
        document.getElementById('pedido').value = '';

        mostrarClientes();
    }

    function avisarERemover(id, nome, telefone, pedido) {
        // 1. Criar a mensagem e abrir WhatsApp
        const mensagem = `Olá ${nome}, tudo bem? O item que você procurava (${pedido}) acabou de chegar aqui na loja! 🥳`;
        const linkWhatsapp = `https://wa.me/55${telefone}?text=${encodeURIComponent(mensagem)}`;
        
        window.open(linkWhatsapp, '_blank');

        // 2. Remover o cliente da lista automaticamente
        removerCliente(id, false); // false para não pedir confirmação ao avisar
    }

    function mostrarClientes() {
        const corpoTabela = document.querySelector('#tabelaClientes tbody');
        corpoTabela.innerHTML = '';
        const clientes = JSON.parse(localStorage.getItem('loja_v3') || '[]');

        if (clientes.length === 0) {
            corpoTabela.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#999;">Nenhum cliente na lista.</td></tr>';
        }

        clientes.forEach(cliente => {
            const row = corpoTabela.insertRow();
            row.innerHTML = `
                <td><strong>${cliente.nome}</strong><br><small>${cliente.telefone}</small></td>
                <td>${cliente.pedido}</td>
                <td>
                    <button class="btn-whatsapp" onclick="avisarERemover(${cliente.id}, '${cliente.nome}', '${cliente.telefone}', '${cliente.pedido}')">
                        Avisar e Retirar
                    </button>
                    <button class="btn-delete" onclick="removerCliente(${cliente.id}, true)">🗑️</button>
                </td>
            `;
        });
    }

    function removerCliente(id, confirmar) {
        if (confirmar && !confirm("Deseja excluir este registro sem avisar?")) return;

        let clientes = JSON.parse(localStorage.getItem('loja_v3') || '[]');
        clientes = clientes.filter(c => c.id !== id);
        localStorage.setItem('loja_v3', JSON.stringify(clientes));
        mostrarClientes();
    }
</script>

</body>
</html>
