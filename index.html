<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestão P&B Casa de Rações</title>
    <style>
        :root { --laranja: #ff6600; --laranja-escuro: #e65c00; --branco: #ffffff; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; background: var(--branco); padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-top: 8px solid var(--laranja); }
        
        h2, h3 { color: var(--laranja); margin-top: 0; display: flex; align-items: center; gap: 10px; }
        .header-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        
        .form-group { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr auto; gap: 10px; margin-bottom: 25px; }
        input, select { padding: 12px; border: 2px solid #eee; border-radius: 8px; outline: none; }
        input:focus { border-color: var(--laranja); }
        
        button { cursor: pointer; font-weight: bold; border-radius: 8px; border: none; transition: 0.3s; }
        .btn-save { background: var(--laranja); color: white; padding: 12px; }
        .btn-save:hover { background: var(--laranja-escuro); }
        .btn-export { background: #333; color: white; padding: 8px 15px; font-size: 12px; }

        .search-box { margin-bottom: 20px; display: flex; gap: 10px; }
        .search-box input { flex: 1; }

        .tabs { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab-btn { padding: 10px 20px; background: #eee; border-radius: 8px 8px 0 0; }
        .tab-btn.active { background: var(--laranja); color: white; }
        
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th { background: #f8f9fa; padding: 12px; text-align: left; border-bottom: 2px solid #eee; }
        td { padding: 12px; border-bottom: 1px solid #eee; }
        
        .urgente { color: #d9534f; font-weight: bold; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        .btn-wa { background: #25d366; color: white; padding: 7px 12px; text-decoration: none; font-size: 12px; display: inline-block; border-radius: 5px; }
        /* Botão excluir corrigido */
        .btn-del { background: #ff4d4d; color: white; padding: 7px 10px; font-size: 11px; margin-left: 5px; border-radius: 5px; }
        .btn-del:hover { background: #cc0000; }

        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 30px; border-radius: 12px; text-align: center; max-width: 350px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-actions">
        <h2>🔔 espera por produto</h2>
        <button class="btn-export" onclick="exportarCSV()">📥 Exportar Backup (Excel)</button>
    </div>
    
    <div class="form-group">
        <input type="text" id="nome" placeholder="Nome">
        <input type="text" id="tel" placeholder="DDD + Número">
        <input type="text" id="prod" placeholder="Produto">
        <select id="cat">
            <option value="Geral">Categoria</option>
            <option value="Cães">Cães</option>
            <option value="Gatos">Gatos</option>
            <option value="Aves">Aves</option>
            <option value="Peixes">Peixes</option>
            <option value="Roedores">Roedores</option>
            <option value="Farmácia">Farmácia</option>
            <option value="Acessórios">Acessórios</option>
            <option value="Outros">Outros</option>
        </select>
        <button class="btn-save" onclick="adicionar()">Salvar</button>
    </div>

    <div class="search-box">
        <input type="text" id="busca" onkeyup="filtrar()" placeholder="🔎 Pesquisar por nome ou produto...">
    </div>

    <div class="tabs">
        <button id="tabP" class="tab-btn active" onclick="mudarAba('P')">Pendentes</button>
        <button id="tabH" class="tab-btn" onclick="mudarAba('H')">Histórico (15 dias)</button>
    </div>

    <div id="listaPendentes">
        <table id="tabelaP">
            <thead>
                <tr>
                    <th>Cliente</th>
                    <th>Produto/Cat</th>
                    <th>Espera</th>
                    <th>Ação</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <div id="listaHistorico" style="display:none;">
        <table id="tabelaH">
            <thead>
                <tr>
                    <th>Cliente</th>
                    <th>Produto</th>
                    <th>Data Aviso</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<div id="modal"><div class="modal-content"><h3 id="mTit"></h3><p id="mMsg"></p><button onclick="fecharM()" style="background:var(--laranja); color:white; padding:10px 20px;">OK</button></div></div>

<script>
    let abaAtual = 'P';

    document.addEventListener('DOMContentLoaded', () => {
        limparHistoricoAntigo();
        carregar();
    });

    function limparHistoricoAntigo() {
        let historico = JSON.parse(localStorage.getItem('loja_h') || '[]');
        const hoje = new Date().getTime();
        const quinzeDiasEmMs = 15 * 24 * 60 * 60 * 1000;

        // Filtra apenas o que tem menos de 15 dias
        const historicoNovo = historico.filter(c => {
            const dataAvisoMs = new Date(c.timestampAviso).getTime();
            return (hoje - dataAvisoMs) < quinzeDiasEmMs;
        });

        localStorage.setItem('loja_h', JSON.stringify(historicoNovo));
    }

    function adicionar() {
        const nome = document.getElementById('nome').value;
        const tel = document.getElementById('tel').value.replace(/\D/g,'');
        const prod = document.getElementById('prod').value;
        const cat = document.getElementById('cat').value;

        if(!nome || !tel || !prod) return msg("Atenção", "Preencha os campos!");

        const cliente = { nome, tel, prod, cat, data: new Date().getTime(), id: Date.now() };
        let lista = JSON.parse(localStorage.getItem('loja_p') || '[]');
        lista.push(cliente);
        localStorage.setItem('loja_p', JSON.stringify(lista));
        
        limparCampos();
        carregar();
        msg("Sucesso", "Cliente adicionado!");
    }

    function carregar() {
        const corpoP = document.querySelector('#tabelaP tbody');
        const corpoH = document.querySelector('#tabelaH tbody');
        corpoP.innerHTML = ''; corpoH.innerHTML = '';

        const pendentes = JSON.parse(localStorage.getItem('loja_p') || '[]');
        const historico = JSON.parse(localStorage.getItem('loja_h') || '[]');

        pendentes.forEach(c => {
            const dias = Math.floor((new Date().getTime() - c.data) / (1000 * 60 * 60 * 24));
            const classeUrgente = dias >= 7 ? 'urgente' : '';
            
            const row = corpoP.insertRow();
            row.innerHTML = `
                <td><strong>${c.nome}</strong><br><small>${c.tel}</small></td>
                <td>${c.prod}<br><small>(${c.cat})</small></td>
                <td class="${classeUrgente}">${dias} dias</td>
                <td>
                    <button class="btn-wa" onclick="avisar(${c.id})">Avisar</button>
                    <button class="btn-del" onclick="remover(${c.id}, 'P')">Excluir</button>
                </td>
            `;
        });

        historico.forEach(c => {
            const row = corpoH.insertRow();
            row.innerHTML = `<td>${c.nome}</td><td>${c.prod}</td><td>${c.dataAviso}</td><td style="color:green">Avisado ✅</td>`;
        });
    }

    function avisar(id) {
        let pendentes = JSON.parse(localStorage.getItem('loja_p') || '[]');
        const c = pendentes.find(i => i.id === id);
        
        const texto = `Olá ${c.nome}, aqui é da P&B Casa de Rações, passando para avisar que já temos (${c.prod}) disponível e podemos separar para você. Fico no aguardo 😊🐶🐱! 🥳`;
        window.open(`https://wa.me/55${c.tel}?text=${encodeURIComponent(texto)}`, '_blank');

        let historico = JSON.parse(localStorage.getItem('loja_h') || '[]');
        historico.unshift({
            ...c, 
            dataAviso: new Date().toLocaleDateString(),
            timestampAviso: new Date().getTime() // Para o controle de 15 dias
        });
        localStorage.setItem('loja_h', JSON.stringify(historico));

        remover(id, 'P', false);
    }

    function remover(id, listaTipo, confirmar = true) {
        if(confirmar && !confirm("Deseja excluir este registro permanentemente?")) return;
        let key = listaTipo === 'P' ? 'loja_p' : 'loja_h';
        let lista = JSON.parse(localStorage.getItem(key));
        localStorage.setItem(key, JSON.stringify(lista.filter(i => i.id !== id)));
        carregar();
    }

    function mudarAba(aba) {
        abaAtual = aba;
        document.getElementById('listaPendentes').style.display = aba === 'P' ? 'block' : 'none';
        document.getElementById('listaHistorico').style.display = aba === 'H' ? 'block' : 'none';
        document.getElementById('tabP').className = 'tab-btn ' + (aba === 'P' ? 'active' : '');
        document.getElementById('tabH').className = 'tab-btn ' + (aba === 'H' ? 'active' : '');
    }

    function filtrar() {
        const termo = document.getElementById('busca').value.toLowerCase();
        const linhas = document.querySelectorAll('#tabelaP tbody tr');
        linhas.forEach(l => {
            l.style.display = l.innerText.toLowerCase().includes(termo) ? '' : 'none';
        });
    }

    function exportarCSV() {
        let lista = JSON.parse(localStorage.getItem('loja_p') || '[]');
        let csv = 'Nome;Telefone;Produto;Categoria;Dias de Espera\n';
        lista.forEach(c => {
            const dias = Math.floor((new Date().getTime() - c.data) / (1000 * 60 * 60 * 24));
            csv += `${c.nome};${c.tel};${c.prod};${c.cat};${dias}\n`;
        });
        const blob = new Blob(["\ufeff" + csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.setAttribute("download", "backup_loja.csv");
        link.click();
    }

    function msg(t, m) { document.getElementById('mTit').innerText = t; document.getElementById('mMsg').innerText = m; document.getElementById('modal').style.display = 'flex'; }
    function fecharM() { document.getElementById('modal').style.display = 'none'; }
    function limparCampos() { ['nome', 'tel', 'prod'].forEach(id => document.getElementById(id).value = ''); }
</script>
</body>
</html>
