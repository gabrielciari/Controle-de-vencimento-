<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Avisos - Loja</title>
    <style>
        :root { --primary: #25d366; --dark: #128c7e; --bg: #e5ddd5; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); padding: 20px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #075e54; text-align: center; margin-bottom: 25px; }
        
        .form-group { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 10px; margin-bottom: 30px; }
        input { padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        input:focus { border-color: var(--dark); outline: none; }
        
        button.btn-save { background: var(--dark); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; padding: 0 20px; }
        button.btn-save:hover { background: #0b6e62; }

        table { width: 100%; border-collapse: collapse; background: white; }
        th { background: #f0f2f5; color: #54656f; padding: 15px; text-align: left; border-bottom: 2px solid #ddd; }
        td { padding: 15px; border-bottom: 1px solid #eee; vertical-align: middle; }
        
        .btn-whatsapp { background: var(--primary); color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; text-decoration: none; font-size: 13px; font-weight: bold; display: inline-flex; align-items: center; gap: 5px; }
        .btn-whatsapp:hover { background: #1da851; }
        
        .btn-delete { background: #ff4b2b; color: white; border: none; padding: 8px; border-radius: 6px; cursor: pointer; margin-left: 5px; }
        
        @media (max-width: 600px) { .form-group { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="container">
    <h2>📦 Gestão de Chegada de Mercadoria</h2>
    
    <div class="form-group">
        <input type="text" id="nome" placeholder="Nome do Cliente">
        <input type="text" id="telefone" placeholder="DDD + Número (Só números)">
        <input type="text" id="pedido" placeholder="O que ele encomendou?">
        <button class="btn-save" onclick="adicionarCliente()">Salvar Cliente</button>
    </div>

    <table id="tabelaClientes">
        <thead>
            <tr>
                <th>Cliente</th>
                <th>O que precisa</th>
                <th>Ação</th>
            </tr>
        </thead>
        <tbody>
            </tbody>
    </table>
</div>

<script>
    document.addEventListener('DOMContentLoaded', mostrarClientes);

    function adicionarCliente() {
        const nome = document.getElementById('nome').value;
        const telefone = document.getElementById('telefone').value.replace(/\D/g,'');
        const pedido = document.getElementById('pedido').value;

        if (!nome || !telefone || !pedido) {
            alert("Por favor, preencha todos os campos!");
            return;
        }

        const cliente = { nome, telefone, pedido, id: Date.now() };
        let clientes = JSON.parse(localStorage.getItem('clientes_loja') || '[]');
        clientes.push(cliente);
        localStorage.setItem('clientes_loja', JSON.stringify(clientes));

        // Limpa os campos
        document.getElementById('nome').value = '';
        document.getElementById('telefone').value = '';
        document.getElementById('pedido').value = '';

        mostrarClientes();
    }

    function mostrarClientes() {
        const corpoTabela = document.querySelector('#tabelaClientes tbody');
        corpoTabela.innerHTML = '';
        const clientes = JSON.parse(localStorage.getItem('clientes_loja') || '[]');

        clientes.forEach(cliente => {
            // Criando a mensagem personalizada
            const mensagem = `Olá ${cliente.nome}, tudo bem? Estou passando para avisar que o item que você procurava (${cliente.pedido}) acabou de chegar aqui na loja! 🥳`;
            const linkWhatsapp = `https://wa.me/55${cliente.telefone}?text=${encodeURIComponent(mensagem)}`;

            const row = corpoTabela.insertRow();
            row.innerHTML = `
                <td><strong>${cliente.nome}</strong><br><small>${cliente.telefone}</small></td>
                <td>${cliente.pedido}</td>
                <td>
                    <a href="${linkWhatsapp}" target="_blank" class="btn-whatsapp">
                        Avisar Chegada
                    </a>
                    <button class="btn-delete" onclick="removerCliente(${cliente.id})">🗑️</button>
                </td>
            `;
        });
    }

    function removerCliente(id) {
        if(confirm("Deseja remover este cliente da lista?")) {
            let clientes = JSON.parse(localStorage.getItem('clientes_loja') || '[]');
            clientes = clientes.filter(c => c.id !== id);
            localStorage.setItem('clientes_loja', JSON.stringify(clientes));
            mostrarClientes();
        }
    }
</script>

</body>
</html>
